name: video-analysis-app

services:
  video-analysis-app:
    image: ghcr.io/candy-s99/video-analyse-app-public:${APP_IMAGE_TAG:-stable}
    restart: on-failure:5
    environment:
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-}"
      NODE_ENV: production
      DATA_DIR: /data/jobs
      TEMP_DIR: /tmp
      SEGMENT_LENGTH: "${SEGMENT_LENGTH:-30}"
      EXTRACT_TRANSCRIPT: "${EXTRACT_TRANSCRIPT:-true}"
      APP_BIND_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${APP_PORT:-3006}:3000"
    volumes:
      - video-analysis-data:/data/jobs
      - ./output:/data/jobs/output
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  video-analysis-data:
