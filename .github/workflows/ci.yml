name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      YOUTUBE_DL_SKIP_DOWNLOAD: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Validate Compose configuration
        shell: bash
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build and smoke-test the Docker container
        shell: bash
        run: |
          trap 'docker compose down --remove-orphans' EXIT
          docker compose up --build -d
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3006/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=100 video-analysis-app
          exit 1
